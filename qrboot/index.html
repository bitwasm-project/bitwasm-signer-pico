<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>qrboot loader</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#11161a">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root { --bg: #11161a; --panel: #1b2228; --line: #2e3a43; --fg: #e6edf2; --muted: #93a2ad; --accent: #f0a23a; --ok: #4cc2a4; --bad: #e5675c; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 -apple-system, system-ui, sans-serif; touch-action: manipulation; overscroll-behavior: none; }
  main { min-height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px;
    padding: calc(env(safe-area-inset-top) + 12px) 16px calc(env(safe-area-inset-bottom) + 16px); }
  header h1 { font-size: 17px; margin: 0; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  section { display: flex; flex-direction: column; gap: 12px; flex: 1; }
  [hidden] { display: none !important; }
  button, label.btn { appearance: none; border: 1px solid var(--line); background: #26313a; color: var(--fg); border-radius: 12px;
    font: 600 16px/1 system-ui, sans-serif; min-height: 52px; padding: 0 16px; display: flex; align-items: center; justify-content: center;
    user-select: none; -webkit-user-select: none; cursor: pointer; }
  button:active, label.btn:active { filter: brightness(1.3); }
  button.primary { background: var(--accent); border-color: var(--accent); color: #1b1206; }
  label.btn input { display: none; }
  label.btn.link { background: none; border: none; min-height: 40px; color: var(--muted); font-weight: 500; font-size: 14px; text-decoration: underline; }
  .mono { font-family: ui-monospace, Menlo, monospace; }
  .bad { color: var(--bad); }

  .viewer { position: relative; aspect-ratio: 1; background: #000; border-radius: 14px; overflow: hidden; border: 4px solid var(--line); transition: border-color .15s; }
  .viewer.seen { border-color: var(--accent); } .viewer.got { border-color: var(--ok); }
  .viewer video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .viewer .guide { position: absolute; inset: 22.5%; border: 2px dashed rgba(255,255,255,.35); border-radius: 8px; pointer-events: none; }
  .viewer p { position: absolute; left: 0; right: 0; bottom: 0; margin: 0; padding: 8px 12px; background: rgba(0,0,0,.65); font-size: 13px; }
  .idle { aspect-ratio: 1; border: 2px dashed var(--line); border-radius: 14px; display: grid; place-items: center; text-align: center; padding: 20px; color: var(--muted); }
  .progress { display: flex; align-items: baseline; gap: 8px; }
  .progress b { font-size: 28px; font-variant-numeric: tabular-nums; }
  .progress span { color: var(--muted); }
  .bar { height: 8px; background: #26313a; border-radius: 4px; overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: var(--ok); transition: width .2s; }
  #grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 4px; }
  #grid span { aspect-ratio: 1; border-radius: 5px; background: #26313a; font-size: 11px; display: grid; place-items: center; color: var(--muted); }
  #grid span.got { background: var(--ok); color: #06231c; }
  #grid span.new { outline: 2px solid var(--accent); outline-offset: 1px; }
  #verify p { margin: 0; }
  .hash { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px 10px; font-size: 20px; color: var(--accent); background: var(--panel);
    border-radius: 12px; padding: 14px; text-align: center; letter-spacing: .05em; margin-top: 8px; }
  .actions { margin-top: auto; display: flex; flex-direction: column; gap: 8px; }

  #device { align-items: center; }
  .screen { position: relative; width: min(100%, calc(100dvh - 330px)); min-width: 220px; }
  canvas#screen { width: 100%; aspect-ratio: 1; image-rendering: pixelated; background: #000; border-radius: 12px; display: block; }
  .screen video { position: absolute; width: 2px; height: 2px; opacity: 0; pointer-events: none; }
  .pad { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; justify-items: center; width: 100%; max-width: 400px; margin-top: auto; }
  .dpad { display: grid; grid-template-columns: repeat(3, 64px); grid-template-rows: repeat(3, 64px); gap: 4px; }
  .dpad button { min-height: 0; padding: 0; font-size: 20px; border-radius: 14px; }
  .dpad .ok { background: #33424d; font-size: 15px; }
  .round { width: 64px; height: 64px; min-height: 0; border-radius: 50%; padding: 0; }
  details { width: 100%; font-size: 13px; color: var(--muted); }
  details summary { padding: 8px 0; cursor: pointer; }
  details > div { display: grid; gap: 8px; }
  pre#log { margin: 0; max-height: 200px; overflow: auto; background: #0c1013; border-radius: 8px; padding: 10px; font-size: 11px; white-space: pre-wrap; word-break: break-all; color: var(--fg); }
</style>
<main>
  <header>
    <h1>qrboot loader</h1>
    <p id="iso"></p>
  </header>

  <section id="boot">
    <div class="idle" id="idle">Point the camera at the printed app codes, one at a time, in any order. Fill the inner square with one code.</div>
    <div class="viewer" id="scanBox" hidden>
      <video id="bootVideo" playsinline muted></video>
      <div class="guide"></div>
      <p id="scanState">Starting the camera</p>
    </div>
    <div class="progress"><b id="count">0</b><span id="bootStatus">codes read</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div id="grid"></div>

    <div id="verify" hidden>
      <p>SHA-256 of the app read from the codes. Run it only if this matches the one printed on the sheet.</p>
      <div class="hash mono" id="hash"></div>
    </div>

    <div class="actions" id="scanActions">
      <button id="cam" class="primary" disabled>Loading</button>
      <label class="btn link">Read code images instead<input id="bootFiles" type="file" accept="image/*" multiple></label>
    </div>
    <div class="actions" id="verifyActions" hidden>
      <button id="run" class="primary">It matches: run the app</button>
      <button id="discard">It differs: discard</button>
    </div>
  </section>

  <section id="device" hidden>
    <div class="screen">
      <canvas id="screen" width="240" height="240"></canvas>
      <video id="video" playsinline muted></video>
    </div>
    <div class="pad">
      <button class="round" data-key="5">A</button>
      <div class="dpad">
        <span></span><button data-key="0">&#9650;</button><span></span>
        <button data-key="2">&#9664;</button><button data-key="4" class="ok">OK</button><button data-key="3">&#9654;</button>
        <span></span><button data-key="1">&#9660;</button><span></span>
      </div>
      <button class="round" data-key="6">B</button>
    </div>
    <details>
      <summary>Images and log</summary>
      <div>
        <label class="btn">Show images to the camera<input id="feedFiles" type="file" accept="image/*" multiple></label>
        <pre id="log"></pre>
      </div>
    </details>
  </section>
</main>
<script type="module" src="loader.js"></script>
</html>
